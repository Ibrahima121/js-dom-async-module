<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive To Do List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="todo-card">
    <p class="eyebrow">My Tasks</p>
    <h1>Interactive To Do List</h1>
    <p class="intro">Click a task to mark it complete or incomplete.</p>
    <ul id="todo-list" aria-label="To-do items">
      <li class="todo-item" tabindex="0" role="button" aria-pressed="false"><span>Learn JavaScript basics</span><span class="check" aria-hidden="true">✓</span></li>
      <li class="todo-item" tabindex="0" role="button" aria-pressed="false"><span>Practise DOM manipulation</span><span class="check" aria-hidden="true">✓</span></li>
      <li class="todo-item" tabindex="0" role="button" aria-pressed="false"><span>Build an interactive project</span><span class="check" aria-hidden="true">✓</span></li>
      <li class="todo-item" tabindex="0" role="button" aria-pressed="false"><span>Push the project to GitHub</span><span class="check" aria-hidden="true">✓</span></li>
    </ul>
    <p class="progress" id="progress" aria-live="polite">0 of 4 tasks completed</p>
  </main>
</body>
</html>
